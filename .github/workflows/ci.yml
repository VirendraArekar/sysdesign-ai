name: System Design AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend Testing & Verification
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Build & Unit/Integration Tests (Java & Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: mvn -f backend/pom.xml clean test -B

  # ---------------------------------------------------------------------------
  # Job 2: Frontend Testing & Production Build
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend Vitest & Vite Production Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Vitest Frontend Tests
        run: npm --prefix frontend test

      - name: Compile TypeScript & Build Production Bundle
        run: npm --prefix frontend run build
